<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseAI — Links</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #06040F;
    --purple: #9649FF;
    --lavender: #D2AAFF;
    --offwhite: #EBE4FF;
    --gray: #786FA5;
    --green: #25D366;
    --pink: #E1306C;
    --card-h: 80px;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    font-family: 'Instrument Sans', sans-serif;
    color: var(--offwhite);
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 500px at 20% 50%, rgba(55,12,130,0.38) 0%, transparent 70%),
      radial-gradient(ellipse 500px 400px at 80% 50%, rgba(60,12,140,0.35) 0%, transparent 70%),
      radial-gradient(ellipse 400px 300px at 50% 100%, rgba(40,8,90,0.3) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Top + bottom gradient lines */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #6428C8, #9649FF, #D2AAFF);
    z-index: 10;
  }

  .bottom-line {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #D2AAFF, #9649FF, #6428C8);
    z-index: 10;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    padding: 48px 24px 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── Avatar ── */
  .avatar-wrap {
    position: relative;
    margin-bottom: 20px;
    animation: fadeDown 0.6s ease both;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(145deg, #1C0A41, #2E1060);
    border: 3px solid rgba(150, 73, 255, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .avatar::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(#9649FF, #D2AAFF, #6428C8, #9649FF);
    z-index: -1;
    animation: spin 4s linear infinite;
  }

  .avatar-inner {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(145deg, #1C0A41, #2E1060);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 2px;
  }

  .pulse-icon {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .pulse-icon svg {
    width: 34px;
    height: 20px;
  }

  .avatar-p {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: rgba(200,150,255,0.9);
    line-height: 1;
  }

  /* Glow ring */
  .avatar-glow {
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(150,73,255,0.25) 0%, transparent 70%);
    animation: pulse-glow 2.5s ease-in-out infinite;
  }

  /* ── Brand name ── */
  .brand {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 40px;
    line-height: 1;
    margin-bottom: 6px;
    animation: fadeDown 0.6s 0.1s ease both;
  }
  .brand span:first-child { color: var(--purple); }
  .brand span:last-child  { color: var(--lavender); font-weight: 400; }

  .handle {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: var(--gray);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
    animation: fadeDown 0.6s 0.15s ease both;
  }

  .tagline {
    font-size: 16px;
    color: var(--offwhite);
    text-align: center;
    line-height: 1.5;
    margin-bottom: 18px;
    animation: fadeDown 0.6s 0.2s ease both;
  }

  /* Separator */
  .sep {
    width: 160px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(110,45,195,0.6), transparent);
    margin-bottom: 28px;
    animation: fadeDown 0.6s 0.25s ease both;
  }

  /* ── Buttons ── */
  .buttons {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 0;
    height: var(--card-h);
    border-radius: 18px;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
    border: none;
    outline: none;
  }

  .btn:hover { transform: translateY(-2px) scale(1.01); }
  .btn:active{ transform: translateY(0)   scale(0.99); }

  /* Left accent bar */
  .btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    border-radius: 18px 0 0 18px;
  }

  /* Shimmer on hover */
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.06) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.5s ease;
  }
  .btn:hover::after { transform: translateX(100%); }

  /* Icon circle */
  .btn-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    margin-left: 18px;
    position: relative;
    z-index: 1;
  }

  .btn-text {
    flex: 1;
    padding: 0 12px 0 14px;
    position: relative;
    z-index: 1;
  }

  .btn-label {
    font-family: 'Instrument Sans', sans-serif;
    font-weight: 600;
    font-size: 20px;
    line-height: 1.2;
    display: block;
  }

  .btn-sub {
    font-size: 13px;
    opacity: 0.75;
    display: block;
    margin-top: 3px;
  }

  .btn-arrow {
    font-size: 22px;
    margin-right: 20px;
    opacity: 0.7;
    transition: transform 0.2s ease, opacity 0.2s ease;
    position: relative;
    z-index: 1;
  }
  .btn:hover .btn-arrow { transform: translateX(4px); opacity: 1; }

  /* WhatsApp */
  .btn-wa {
    background: rgba(14,45,30,0.88);
    border: 2px solid rgba(37,211,102,0.55);
    box-shadow: 0 0 24px rgba(37,211,102,0.12), inset 0 1px 0 rgba(37,211,102,0.1);
    animation: fadeUp 0.5s 0.3s ease both;
  }
  .btn-wa::before       { background: var(--green); }
  .btn-wa .btn-icon     { background: rgba(37,211,102,0.12); }
  .btn-wa .btn-label    { color: #C8F5DC; }
  .btn-wa .btn-sub      { color: #5EC98A; }
  .btn-wa .btn-arrow    { color: var(--green); }
  .btn-wa:hover { box-shadow: 0 4px 32px rgba(37,211,102,0.25); }

  /* Instagram */
  .btn-ig {
    background: rgba(50,14,32,0.88);
    border: 2px solid rgba(225,48,108,0.55);
    box-shadow: 0 0 24px rgba(225,48,108,0.12), inset 0 1px 0 rgba(225,48,108,0.1);
    animation: fadeUp 0.5s 0.4s ease both;
  }
  .btn-ig::before    { background: var(--pink); }
  .btn-ig .btn-icon  { background: rgba(225,48,108,0.12); }
  .btn-ig .btn-label { color: #FFD0DF; }
  .btn-ig .btn-sub   { color: #C86488; }
  .btn-ig .btn-arrow { color: var(--pink); }
  .btn-ig:hover { box-shadow: 0 4px 32px rgba(225,48,108,0.25); }

  /* Site */
  .btn-site {
    background: rgba(22,13,52,0.88);
    border: 2px solid rgba(150,73,255,0.55);
    box-shadow: 0 0 24px rgba(150,73,255,0.12), inset 0 1px 0 rgba(150,73,255,0.1);
    animation: fadeUp 0.5s 0.5s ease both;
  }
  .btn-site::before    { background: var(--purple); }
  .btn-site .btn-icon  { background: rgba(150,73,255,0.12); }
  .btn-site .btn-label { color: var(--offwhite); }
  .btn-site .btn-sub   { color: var(--gray); }
  .btn-site .btn-arrow { color: var(--purple); }
  .btn-site:hover { box-shadow: 0 4px 32px rgba(150,73,255,0.28); }

  /* ── Footer ── */
  .footer {
    margin-top: 36px;
    text-align: center;
    animation: fadeUp 0.5s 0.6s ease both;
  }
  .footer p {
    font-size: 13px;
    color: var(--gray);
    margin-bottom: 6px;
  }
  .footer .logo-mini {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 16px;
  }
  .footer .logo-mini span:first-child { color: var(--purple); font-weight: 700; }
  .footer .logo-mini span:last-child  { color: var(--lavender); font-weight: 400; }

  /* ── Keyframes ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes pulse-glow {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50%       { opacity: 1;   transform: scale(1.08); }
  }
</style>
</head>
<body>

<div class="bottom-line"></div>

<div class="page">

  <!-- Avatar -->
  <div class="avatar-wrap">
    <div class="avatar-glow"></div>
    <div class="avatar">
      <div class="avatar-inner">
        <!-- Pulse waveform SVG -->
        <svg class="pulse-icon" viewBox="0 0 60 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polyline points="0,12 10,12 16,4 22,20 28,12 38,12" stroke="rgba(200,150,255,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="38" cy="12" r="2.5" fill="rgba(200,150,255,0.9)"/>
        </svg>
        <span class="avatar-p">P</span>
      </div>
    </div>
  </div>

  <!-- Brand -->
  <div class="brand"><span>Pulse</span><span>AI</span></div>
  <div class="handle">@pulseai.digital</div>
  <div class="tagline">Inteligência para o seu negócio.</div>
  <div class="sep"></div>

  <!-- Buttons -->
  <div class="buttons">

    <!-- WhatsApp -->
    <a class="btn btn-wa" href="https://wa.me/5546991274518" target="_blank" rel="noopener">
      <div class="btn-icon">💬</div>
      <div class="btn-text">
        <span class="btn-label">WhatsApp</span>
        <span class="btn-sub">Chama a gente agora!</span>
      </div>
      <span class="btn-arrow">→</span>
    </a>

    <!-- Instagram -->
    <a class="btn btn-ig" href="https://www.instagram.com/pulseai.digital/" target="_blank" rel="noopener">
      <div class="btn-icon">📷</div>
      <div class="btn-text">
        <span class="btn-label">Instagram</span>
        <span class="btn-sub">@pulseai.digital</span>
      </div>
      <span class="btn-arrow">→</span>
    </a>

    <!-- Site -->
    <a class="btn btn-site" href="https://pulseaidigital.lovable.app" target="_blank" rel="noopener">
      <div class="btn-icon">🌐</div>
      <div class="btn-text">
        <span class="btn-label">Nosso Site</span>
        <span class="btn-sub">pulseaidigital.lovable.app</span>
      </div>
      <span class="btn-arrow">→</span>
    </a>

  </div>

  <!-- Footer -->
  <div class="footer">
    <p>Feito com IA. Entregue com resultado.</p>
    <div class="logo-mini"><span>Pulse</span><span>AI</span></div>
  </div>

</div>
</body>
</html>
